on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dvc-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC remote for DagsHub
        run: |
          dvc remote add -d origin s3://dvc
          dvc remote modify origin endpointurl https://dagshub.com/pavani96-ai/flight_price_prediction.s3
          dvc remote modify origin access_key_id "${{ secrets.DAGSHUB_USER }}"
          dvc remote modify origin secret_access_key "${{ secrets.DAGSHUB_TOKEN }}"
          dvc remote modify origin use_ssl true

      - name: Pull data from DVC
        run: dvc pull -r origin

      - name: Run training/processing script
        run: python main.py

      - name: DVC Add, Commit and Push
        run: |
          # 1. Add data/ folder to DVC
          dvc add data/
          
          # 2. Configure Git for the bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. Stage the .dvc and .gitignore files
          git add data/*.dvc .gitignore
          
          # 4. Commit changes
          git commit -m "chore: update data version via CI" || echo "No changes to commit"
          
          # 5. Push data to DagsHub and code changes to GitHub
          dvc push -r origin
          git push