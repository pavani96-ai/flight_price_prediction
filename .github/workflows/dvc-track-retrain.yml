name: DVC Data Tracking and Retrain

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC remote for DagsHub
        run: |
          dvc remote add -d origin https://dagshub.com/pavani96-ai/flight_price_prediction.dvc || true
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "${{ secrets.DAGSHUB_USER }}"
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_TOKEN }}"
      - name: Debug Python path and files
        run: |
          pwd
          ls -R src/flight_price_prediction/utils/metrics
          python -c "import sys; print(sys.path)"
      - name: Run data ingestion
        env:
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python main1.py

      - name: Track feature store with DVC
        run: |
          dvc add artifacts/data_ingestion/feature_store/flight_fare.csv || true

      - name: Commit updated DVC metadata
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dvc.yaml dvc.lock artifacts/data_ingestion/feature_store/flight_fare.csv.dvc || true
          if git diff --staged --quiet; then
            echo "No DVC metadata changes to commit"
          else
            git commit -m "CI: update feature_store after ingestion [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push data blobs to DagsHub
        run: |
          dvc push -r origin
