on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dvc-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Explicitly install dvc[s3] to ensure the command is available
          pip install dvc[s3]
          # Then install everything else
          pip install -r requirements.txt

      - name: Configure DVC remote for DagsHub
        run: |
          # The -f flag overwrites the existing configuration
          dvc remote add -f -d origin s3://dvc
          dvc remote modify origin endpointurl https://dagshub.com/pavani96-ai/flight_price_prediction.s3
          dvc remote modify origin access_key_id "${{ secrets.DAGSHUB_USER }}"
          dvc remote modify origin secret_access_key "${{ secrets.DAGSHUB_TOKEN }}"
          dvc remote modify origin use_ssl true

      - name: Pull data from DVC
        run: dvc pull -r origin

      - name: Run training/processing script
        env:
          # This maps the GitHub Secret to an environment variable the code can read
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
        
        run: python main.py

      - name: DVC Add, Commit and Push
        run: |
          # 1. Add the specific file you are tracking
          dvc add artifacts/data_ingestion/feature_store/flight_fare.csv
          
          # 2. Configure Git for the bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. Stage the .dvc and .gitignore files
          git add artifacts/data_ingestion/feature_store/flight_fare.csv.dvc .gitignore
          
          # 4. Commit changes
          git commit -m "chore: update data version via CI" || echo "No changes to commit"
          
          # 5. Push data to DagsHub and code changes to GitHub
          dvc push -r origin
          git push