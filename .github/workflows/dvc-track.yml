name: DVC Data Versioning and Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dvc-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dvc[s3]
          pip install -r requirements.txt

      - name: Configure DVC remote for DagsHub
        run: |
          dvc remote add -f -d origin s3://dvc
          dvc remote modify origin endpointurl https://dagshub.com/pavani96-ai/flight_price_prediction.s3
          dvc remote modify origin access_key_id "${{ secrets.DAGSHUB_USER }}"
          dvc remote modify origin secret_access_key "${{ secrets.DAGSHUB_TOKEN }}"
          dvc remote modify origin use_ssl true

      - name: Pull data from DVC
        run: dvc pull -r origin

      - name: Run training/processing script
        env:
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
        run: python main.py

      - name: DVC Add, Commit and Push
        run: |
          # 1. Add the specific file to DVC
          dvc add artifacts/data_ingestion/feature_store/flight_fare.csv
          
          # 2. Configure Git for the bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. Stage the files
          git add artifacts/data_ingestion/feature_store/flight_fare.csv.dvc .gitignore
          
          # 4. Commit changes with [skip ci] to prevent an infinite loop
          git commit -m "chore: update data version via CI [skip ci]" || echo "No changes to commit"
          
          # 5. Push data to DagsHub
          dvc push -r origin
          
          # 6. Push code changes to GitHub
          git push